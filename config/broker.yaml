# Broker del RB-2 en modo FISICO (Pregunta 2 y 3): camara + MoveIt2 (solo plan) + pymycobot.
# Lo carga scripts/broker.sh. Los valores -p de broker.sh ganan sobre este archivo.
/**:
  ros__parameters:
    politica: prioridad
    # Escala de prioridad = la que entrega /interpretar_orden:
    #   LAYA  -> score x 50 (en la practica 59..86)
    #   respaldo / modo sin LAYA -> 20 (sin prisa), 80 (normal), 180 (urgente)
    # puntaje = prioridad + espera_s / tau  ->  con tau = 0.2 s, cada segundo de espera
    # suma 5 puntos: un salto de 50 puntos (un nivel de LAYA) equivale a ~10 s de espera.
    # Asi el envejecimiento sigue evitando la inanicion con la escala del modelo.
    tau_envejecimiento_s: 0.2
    publicar_joint_states: false
    habilitar_pick_place_simulado: false
    habilitar_planificacion_pick_place: false
    habilitar_pick_place_fisico: true
    # true: si LAYA no responde, la decision degradada (respaldo) tambien se atiende.
    # Para exigir solo LAYA: SOLO_LAYA=1 bash scripts/broker.sh
    permitir_respaldo_pick_place: true
    inventario_pick_place: ["cubo:amarillo", "cubo:azul", "cubo:verde", "cubo:rojo"]
    zonas_pick_place: ["deposito"]
    # "coloca/deposita/lleva el cubo X" es la misma tarea fisica: recoger y dejar en el deposito.
    acciones_pick_place: ["recoger", "colocar"]
    moveit_grupo: arm_group
    moveit_enlace: 6_Link
    # Marco raiz del modelo JetCobot cargado en MoveIt (URDF: dummy).
    moveit_marco: dummy
    moveit_timeout_s: 8.0
    cola_max: 20
