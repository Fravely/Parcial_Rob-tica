# Ensayo de la cola SIN camara, SIN MoveIt2 y SIN brazo. Etapas falsas.
#   ros2 run arm_broker broker --ros-args --params-file plantillas/item2_simulado.yaml
arm_broker:
  ros__parameters:
    politica: prioridad
    tau_envejecimiento_s: 8.0
    publicar_joint_states: false
    habilitar_pick_place_simulado: true
    habilitar_planificacion_pick_place: false
    habilitar_pick_place_fisico: false
    permitir_respaldo_pick_place: true      # en ensayo se permite; en la demo evaluada, false
    inventario_pick_place: ["cubo:amarillo", "cubo:azul", "cubo:verde", "cubo:rojo"]
    zonas_pick_place: ["deposito"]
    acciones_pick_place: ["recoger", "colocar"]
    duracion_etapa_simulada_s: 0.2
    archivo_rechazos: evidencias/item2/rechazos.csv
